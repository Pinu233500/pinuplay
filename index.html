<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PinuPlay - Modern Cloud Music</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #1f1c2c 0%, #928dab 100%);
            --sidebar-bg: rgba(18, 18, 18, 0.95);
            --card-bg: rgba(255, 255, 255, 0.07);
            --card-hover: rgba(255, 255, 255, 0.12);
            --accent: #1ed760;
            --text-main: #ffffff;
            --text-muted: #b3b3b3;
        }

        body {
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding-bottom: 110px;
            min-height: 100vh;
        }

        /* Sidebar Glassmorphism */
        .sidebar {
            background: var(--sidebar-bg);
            backdrop-filter: blur(12px);
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            width: 260px;
            padding: 25px;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 100;
        }

        .brand-title {
            font-weight: 700;
            letter-spacing: 0.5px;
            background: linear-gradient(45deg, #1ed760, #2ae372);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-link {
            color: var(--text-muted);
            font-weight: 500;
            padding: 12px 18px;
            border-radius: 8px;
            transition: all 0.3s ease;
            margin-bottom: 5px;
        }

        .nav-link:hover, .nav-link.active {
            color: #000;
            background: var(--accent);
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(30, 215, 96, 0.4);
        }

        /* Main Content */
        .main-content {
            margin-left: 260px;
            padding: 40px;
        }

        /* Music Cards */
        .music-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            transition: all 0.3s ease;
            cursor: pointer;
            overflow: hidden;
        }

        .music-card:hover {
            background: var(--card-hover);
            transform: translateY(-8px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border-color: rgba(30, 215, 96, 0.3);
        }

        .album-art-wrapper {
            position: relative;
            width: 100%;
            height: 170px;
            border-radius: 12px;
            overflow: hidden;
        }

        .album-art {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .music-card:hover .album-art {
            transform: scale(1.05);
        }

        /* Form Upload Glass */
        .upload-card {
            background: rgba(24, 24, 24, 0.85);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        .form-control, .form-control:focus {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            border-radius: 10px;
            padding: 12px;
        }

        .form-control:focus {
            border-color: var(--accent);
            box-shadow: 0 0 10px rgba(30, 215, 96, 0.25);
        }

        /* Player Bar */
        .player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 95px;
            background: rgba(18, 18, 18, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            z-index: 1000;
        }

        .player-controls button {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.3rem;
            margin: 0 12px;
            transition: 0.2s;
            cursor: pointer;
        }

        .player-controls button:hover {
            color: var(--text-main);
            transform: scale(1.1);
        }

        .player-controls button.btn-play {
            background: var(--accent);
            color: #000;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            box-shadow: 0 4px 15px rgba(30, 215, 96, 0.4);
        }

        .player-controls button.btn-play:hover {
            transform: scale(1.08);
            background: #2ae372;
            color: #000;
        }

        .progress-bar-custom {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .progress-filled {
            height: 100%;
            background: var(--accent);
            border-radius: 10px;
            width: 0%;
            transition: width 0.1s linear;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #121212; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
    </style>
</head>
<body>

    <!-- MAIN DASHBOARD -->
    <div id="mainApp">
        <!-- Sidebar -->
        <div class="sidebar d-flex flex-column justify-content-between">
            <div>
                <h3 class="brand-title mb-4"><i class="fa-solid fa-music me-2"></i>PinuPlay</h3>
                <ul class="nav flex-column gap-2">
                    <li class="nav-item"><a class="nav-link active" href="#" onclick="switchTab('home', event)"><i class="fa-solid fa-house me-2"></i> Beranda</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" onclick="switchTab('upload', event)"><i class="fa-solid fa-cloud-arrow-up me-2"></i> Unggah Musik</a></li>
                </ul>
            </div>
            <div class="border-top border-secondary pt-3">
                <div class="d-flex align-items-center gap-2 mb-2">
                    <div class="bg-success rounded-circle d-flex align-items-center justify-content-center text-black fw-bold" style="width: 32px; height: 32px;" id="userInitial">U</div>
                    <span class="text-white small text-truncate" id="lblUser">User</span>
                </div>
                <button class="btn btn-outline-light btn-sm w-100 rounded-pill" onclick="logout()"><i class="fa-solid fa-right-from-bracket me-1"></i> Keluar</button>
            </div>
        </div>

        <!-- Content Area -->
        <div class="main-content">
            <!-- TAB BERANDA -->
            <div id="tabHome">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="fw-bold m-0">Koleksi Musik Cloud Anda</h2>
                </div>
                <div id="songList" class="row g-4">
                    <!-- Data lagu dimuat secara dinamis -->
                </div>
            </div>

            <!-- TAB UPLOAD -->
            <div id="tabUpload" class="d-none">
                <h2 class="fw-bold mb-4">Unggah Musik ke Cloudinary</h2>
                <div class="upload-card p-4 p-md-5" style="max-width: 650px;">
                    <form id="uploadForm" onsubmit="handleUploadMusic(event)">
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-semibold">PILIH FILE AUDIO (Judul otomatis dari nama file)</label>
                            <input type="file" id="upAudioFile" class="form-control" accept="audio/*" onchange="autoFillTitle(this)" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-semibold">JUDUL LAGU</label>
                            <input type="text" id="upTitle" class="form-control" placeholder="Judul lagu otomatis..." required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-semibold">NAMA ARTIS / PENYANYI</label>
                            <input type="text" id="upArtist" class="form-control" placeholder="Contoh: Pinu Band" value="Unknown Artist" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label text-muted small fw-semibold">GAMBAR SAMPUL ALBUM (COVER)</label>
                            <input type="file" id="upCoverFile" class="form-control" accept="image/*" required>
                        </div>
                        <button type="submit" id="btnUploadSubmit" class="btn btn-success w-100 py-3 fw-bold rounded-pill shadow-sm" style="background-color: var(--accent); border: none; color: #000;">Unggah ke Cloud Sekarang</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- PLAYER BAR BAWAH -->
        <div class="player-bar">
            <div class="d-flex align-items-center" style="width: 30%;">
                <img id="playerCover" src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=100" class="rounded-3 me-3 shadow" style="width: 60px; height: 60px; object-fit: cover;">
                <div class="overflow-hidden">
                    <h6 id="playerTitle" class="m-0 text-white text-truncate fw-semibold">Pilih Lagu</h6>
                    <small id="playerArtist" class="text-muted text-truncate d-block">PinuPlay Player</small>
                </div>
            </div>
            <div class="d-flex flex-column align-items-center" style="width: 45%;">
                <div class="player-controls mb-2">
                    <button onclick="prevSong()" title="Sebelumnya"><i class="fa-solid fa-backward-step"></i></button>
                    <button class="btn-play" onclick="togglePlay()" title="Putar/Jeda"><i id="playIcon" class="fa-solid fa-play"></i></button>
                    <button onclick="nextSong()" title="Berikutnya"><i class="fa-solid fa-forward-step"></i></button>
                </div>
                <div class="w-100 d-flex align-items-center gap-3">
                    <small id="currentTime" class="text-muted" style="font-size: 0.75rem;">0:00</small>
                    <div class="progress-bar-custom flex-grow-1" id="progressBar" onclick="seekAudio(event)">
                        <div class="progress-filled" id="progressFilled"></div>
                    </div>
                    <small id="durationTime" class="text-muted" style="font-size: 0.75rem;">0:00</small>
                </div>
            </div>
            <div style="width: 30%;" class="d-flex justify-content-end align-items-center gap-3 text-muted">
                <i class="fa-solid fa-volume-high"></i>
                <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="1" oninput="changeVolume(this.value)" style="accent-color: var(--accent); width: 100px; cursor: pointer;">
            </div>
        </div>
    </div>

    <!-- Audio Element -->
    <audio id="audioPlayer" ontimeupdate="updateProgress()" onended="nextSong()"></audio>

    <script>
        const CLOUD_NAME = "gyqyo2kv";
        const UPLOAD_PRESET = "pinuplay_unsigned";

        let currentUser = localStorage.getItem('pinu_user') || "UserPinu";
        let songsDatabase = JSON.parse(localStorage.getItem('pinu_songs')) || [];
        let currentSongIndex = 0;
        let isPlaying = false;

        const audioPlayer = document.getElementById('audioPlayer');

        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('lblUser').innerText = currentUser;
            document.getElementById('userInitial').innerText = currentUser.charAt(0).toUpperCase();
            renderSongList();
        });

        // Fitur Otomatis Mengisi Judul dari Nama File MP3 yang Dipilih
        function autoFillTitle(input) {
            if (input.files && input.files[0]) {
                let fileName = input.files[0].name;
                // Hilangkan ekstensi file (.mp3, .wav, dll)
                let cleanName = fileName.substring(0, fileName.lastIndexOf('.')) || fileName;
                document.getElementById('upTitle').value = cleanName;
            }
        }

        function logout() {
            localStorage.removeItem('pinu_user');
            location.reload();
        }

        function switchTab(tab, event) {
            document.querySelectorAll('.sidebar .nav-link').forEach(el => el.classList.remove('active'));
            if (tab === 'home') {
                document.getElementById('tabHome').classList.remove('d-none');
                document.getElementById('tabUpload').classList.add('d-none');
                event.currentTarget.classList.add('active');
            } else if (tab === 'upload') {
                document.getElementById('tabHome').classList.add('d-none');
                document.getElementById('tabUpload').classList.remove('d-none');
                event.currentTarget.classList.add('active');
            }
        }

        function renderSongList() {
            const container = document.getElementById('songList');
            if (songsDatabase.length === 0) {
                container.innerHTML = `
                    <div class="col-12 text-center py-5">
                        <div class="text-muted mb-3" style="font-size: 3rem;"><i class="fa-solid fa-compact-disc fa-spin"></i></div>
                        <h4 class="text-white">Belum ada lagu yang tersedia</h4>
                        <p class="text-muted">Yuk, unggah lagu favoritmu melalui menu <strong>Unggah Musik</strong> di sebelah kiri.</p>
                    </div>`;
                return;
            }

            let html = "";
            songsDatabase.forEach((song, index) => {
                html += `
                    <div class="col-md-3 col-sm-6">
                        <div class="music-card p-3 h-100 d-flex flex-column justify-content-between" onclick="playSong(${index})">
                            <div>
                                <div class="album-art-wrapper mb-3 shadow">
                                    <img src="${song.coverUrl}" class="album-art" alt="Cover">
                                </div>
                                <h5 class="text-white text-truncate mb-1 fw-semibold" title="${song.title}">${song.title}</h5>
                                <small class="text-muted text-truncate d-block">${song.artist}</small>
                            </div>
                            <div class="mt-3 d-flex justify-content-end">
                                <span class="badge bg-success bg-opacity-25 text-success rounded-pill px-3 py-1" style="font-size: 0.7rem;"><i class="fa-solid fa-play me-1"></i> Putar</span>
                            </div>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        async function uploadToCloudinary(file, resourceType = 'auto') {
            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', UPLOAD_PRESET);

            const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/${resourceType}/upload`, {
                method: 'POST',
                body: formData
            });
            const data = await res.json();
            if (data.secure_url) {
                return data.secure_url;
            } else {
                throw new Error("Gagal mengunggah ke Cloudinary. Periksa kembali preset unsigned Anda.");
            }
        }

        async function handleUploadMusic(e) {
            e.preventDefault();
            const btn = document.getElementById('btnUploadSubmit');
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin me-2"></i> Mengunggah ke Cloud...`;

            try {
                const title = document.getElementById('upTitle').value;
                const artist = document.getElementById('upArtist').value;
                const audioFile = document.getElementById('upAudioFile').files[0];
                const coverFile = document.getElementById('upCoverFile').files[0];

                const audioUrl = await uploadToCloudinary(audioFile, 'video');
                const coverUrl = await uploadToCloudinary(coverFile, 'image');

                songsDatabase.push({
                    title: title,
                    artist: artist,
                    audioUrl: audioUrl,
                    coverUrl: coverUrl,
                    uploader: currentUser
                });

                localStorage.setItem('pinu_songs', JSON.stringify(songsDatabase));

                alert("Berhasil! Musik baru Anda telah tersimpan di cloud.");
                document.getElementById('uploadForm').reset();
                
                document.getElementById('tabHome').classList.remove('d-none');
                document.getElementById('tabUpload').classList.add('d-none');
                document.querySelectorAll('.sidebar .nav-link')[0].classList.add('active');
                document.querySelectorAll('.sidebar .nav-link')[1].classList.remove('active');
                
                renderSongList();
            } catch (err) {
                alert(err.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = "Unggah ke Cloud Sekarang";
            }
        }

        function playSong(index) {
            currentSongIndex = index;
            const song = songsDatabase[index];

            document.getElementById('playerTitle').innerText = song.title;
            document.getElementById('playerArtist').innerText = song.artist;
            document.getElementById('playerCover').src = song.coverUrl;

            audioPlayer.src = song.audioUrl;
            audioPlayer.play();
            isPlaying = true;
            document.getElementById('playIcon').className = "fa-solid fa-pause";
        }

        function togglePlay() {
            if (songsDatabase.length === 0) return;
            if (isPlaying) {
                audioPlayer.pause();
                isPlaying = false;
                document.getElementById('playIcon').className = "fa-solid fa-play";
            } else {
                if (!audioPlayer.src) playSong(0);
                else audioPlayer.play();
                isPlaying = true;
                document.getElementById('playIcon').className = "fa-solid fa-pause";
            }
        }

        function nextSong() {
            if (songsDatabase.length === 0) return;
            currentSongIndex = (currentSongIndex + 1) % songsDatabase.length;
            playSong(currentSongIndex);
        }

        function prevSong() {
            if (songsDatabase.length === 0) return;
            currentSongIndex = (currentSongIndex - 1 + songsDatabase.length) % songsDatabase.length;
            playSong(currentSongIndex);
        }

        function updateProgress() {
            if (isNaN(audioPlayer.duration)) return;
            const progressPercent = (audioPlayer.currentTime / audioPlayer.duration) * 100;
            document.getElementById('progressFilled').style.width = progressPercent + '%';

            document.getElementById('currentTime').innerText = formatTime(audioPlayer.currentTime);
            document.getElementById('durationTime').innerText = formatTime(audioPlayer.duration);
        }

        function seekAudio(e) {
            const width = document.getElementById('progressBar').clientWidth;
            const clickX = e.offsetX;
            const duration = audioPlayer.duration;
            audioPlayer.currentTime = (clickX / width) * duration;
        }

        function changeVolume(val) {
            audioPlayer.volume = val;
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }
    </script>
</body>
</html>
