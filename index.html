<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PinuPlay - Cloud Music Streaming</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #1f1c2c 0%, #928dab 100%);
            --sidebar-bg: rgba(18, 18, 18, 0.95);
            --card-bg: rgba(255, 255, 255, 0.07);
            --card-hover: rgba(255, 255, 255, 0.12);
            --accent: #1ed760;
            --text-main: #ffffff;
            --text-muted: #b3b3b3;
        }

        body {
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding-bottom: 160px;
            min-height: 100vh;
        }

        .sidebar {
            background: var(--sidebar-bg);
            backdrop-filter: blur(12px);
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            width: 260px;
            padding: 25px;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 100;
        }

        .brand-title {
            font-weight: 700;
            letter-spacing: 0.5px;
            background: linear-gradient(45deg, #1ed760, #2ae372);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-link {
            color: var(--text-muted);
            font-weight: 500;
            padding: 12px 18px;
            border-radius: 8px;
            transition: all 0.3s ease;
            margin-bottom: 5px;
            cursor: pointer;
        }

        .nav-link:hover, .nav-link.active {
            color: #000;
            background: var(--accent);
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(30, 215, 96, 0.4);
        }

        .main-content {
            margin-left: 260px;
            padding: 40px;
        }

        .music-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            transition: all 0.3s ease;
            cursor: pointer;
            overflow: hidden;
        }

        .music-card:hover {
            background: var(--card-hover);
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border-color: rgba(30, 215, 96, 0.3);
        }

        .album-art-wrapper {
            position: relative;
            width: 100%;
            height: 160px;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
        }

        .album-art {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .upload-card {
            background: rgba(24, 24, 24, 0.85);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        .form-control, .form-control:focus {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            border-radius: 10px;
            padding: 12px;
        }

        .form-control:focus {
            border-color: var(--accent);
            box-shadow: 0 0 10px rgba(30, 215, 96, 0.25);
        }

        .player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 95px;
            background: rgba(18, 18, 18, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            z-index: 1000;
        }

        .player-controls button {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.3rem;
            margin: 0 10px;
            cursor: pointer;
        }

        .player-controls button.btn-play {
            background: var(--accent);
            color: #000;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            box-shadow: 0 4px 15px rgba(30, 215, 96, 0.4);
        }

        .progress-bar-custom {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .progress-filled {
            height: 100%;
            background: var(--accent);
            border-radius: 10px;
            width: 0%;
            transition: width 0.1s linear;
        }

        @media (max-width: 768px) {
            .sidebar {
                height: 70px;
                width: 100%;
                top: auto;
                bottom: 0;
                left: 0;
                border-right: none;
                border-top: 1px solid rgba(255, 255, 255, 0.1);
                padding: 10px 15px;
                display: flex;
                flex-direction: row;
                align-items: center;
                justify-content: space-around;
            }
            .sidebar .brand-title, .sidebar .border-top { display: none; }
            .sidebar .nav { flex-direction: row !important; width: 100%; justify-content: space-around; }
            .nav-link { padding: 8px 12px; font-size: 0.9rem; text-align: center; margin-bottom: 0; }
            .main-content { margin-left: 0; padding: 20px 15px; }
            .player-bar { bottom: 70px; height: 75px; padding: 0 15px; }
            .player-bar .desktop-vol { display: none; }
            .player-controls button { font-size: 1.1rem; margin: 0 6px; }
            .player-controls button.btn-play { width: 38px; height: 38px; font-size: 0.95rem; }
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #121212; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
    </style>
</head>
<body>

    <div id="mainApp">
        <!-- Sidebar / Navbar Mobile -->
        <div class="sidebar d-flex flex-column justify-content-between shadow-lg">
            <div>
                <h3 class="brand-title mb-4"><i class="fa-solid fa-music me-2"></i>PinuPlay</h3>
                <ul class="nav flex-column gap-2">
                    <li class="nav-item"><a class="nav-link active" onclick="switchTab('home', event)"><i class="fa-solid fa-house me-2"></i> Beranda</a></li>
                    <li class="nav-item"><a class="nav-link" onclick="switchTab('upload', event)"><i class="fa-solid fa-cloud-arrow-up me-2"></i> Unggah</a></li>
                </ul>
            </div>
            <div class="border-top border-secondary pt-3">
                <button class="btn btn-outline-light btn-sm w-100 rounded-pill" onclick="fetchSongsFromCloud()"><i class="fa-solid fa-rotate me-1"></i> Segarkan Data</button>
            </div>
        </div>

        <!-- Content Area -->
        <div class="main-content">
            <!-- TAB BERANDA -->
            <div id="tabHome">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h3 class="fw-bold m-0">Koleksi Musik Cloud</h3>
                </div>
                <div id="songList" class="row g-3">
                    <div class="col-12 text-center py-5">
                        <div class="text-muted mb-3" style="font-size: 3rem;"><i class="fa-solid fa-compact-disc fa-spin"></i></div>
                        <h4 class="text-white">Memuat daftar lagu...</h4>
                    </div>
                </div>
            </div>

            <!-- TAB UPLOAD -->
            <div id="tabUpload" class="d-none">
                <h3 class="fw-bold mb-4">Unggah File Lagu Baru</h3>
                <div class="upload-card p-3 p-md-5" style="max-width: 650px;">
                    <form id="uploadForm" onsubmit="handleUploadMusic(event)">
                        <div class="mb-4">
                            <label class="form-label text-muted small fw-semibold">PILIH FILE AUDIO (.MP3 / .WAV)</label>
                            <input type="file" id="upAudioFile" class="form-control" accept="audio/*" required>
                            <small class="text-muted mt-1 d-block">Judul lagu akan otomatis diambil dari nama file dan langsung tersinkron ke HP.</small>
                        </div>
                        <button type="submit" id="btnUploadSubmit" class="btn btn-success w-100 py-3 fw-bold rounded-pill shadow-sm" style="background-color: var(--accent); border: none; color: #000;">Unggah ke Cloud Sekarang</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- PLAYER BAR BAWAH -->
        <div class="player-bar">
            <div class="d-flex align-items-center" style="width: 35%;">
                <img id="playerCover" src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=100" class="rounded-3 me-2 shadow" style="width: 48px; height: 48px; object-fit: cover;">
                <div class="overflow-hidden">
                    <h6 id="playerTitle" class="m-0 text-white text-truncate" style="font-size: 0.9rem;">Pilih Lagu</h6>
                    <small id="playerArtist" class="text-muted text-truncate d-block" style="font-size: 0.75rem;">PinuPlay Cloud</small>
                </div>
            </div>
            <div class="d-flex flex-column align-items-center" style="width: 50%;">
                <div class="player-controls mb-1">
                    <button onclick="prevSong()"><i class="fa-solid fa-backward-step"></i></button>
                    <button class="btn-play" onclick="togglePlay()"><i id="playIcon" class="fa-solid fa-play"></i></button>
                    <button onclick="nextSong()"><i class="fa-solid fa-forward-step"></i></button>
                </div>
                <div class="w-100 d-flex align-items-center gap-2">
                    <small id="currentTime" class="text-muted" style="font-size: 0.7rem;">0:00</small>
                    <div class="progress-bar-custom flex-grow-1" id="progressBar" onclick="seekAudio(event)">
                        <div class="progress-filled" id="progressFilled"></div>
                    </div>
                    <small id="durationTime" class="text-muted" style="font-size: 0.7rem;">0:00</small>
                </div>
            </div>
            <div style="width: 15%;" class="desktop-vol d-none d-md-flex justify-content-end align-items-center gap-2 text-muted">
                <i class="fa-solid fa-volume-high"></i>
                <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="1" oninput="changeVolume(this.value)" style="accent-color: var(--accent); width: 80px; cursor: pointer;">
            </div>
        </div>
    </div>

    <!-- Audio Element -->
    <audio id="audioPlayer" ontimeupdate="updateProgress()" onended="nextSong()"></audio>

    <!-- Script Cloudinary & JSONBin Online Sync -->
    <script>
        const CLOUD_NAME = "gyqyo2kv";
        const UPLOAD_PRESET = "pinuplay_unsigned";
        const JSONBIN_URL = "https://api.jsonbin.io/v3/b/66f1207ead19ca34f8a127f8";

        let songsDatabase = [];
        let currentSongIndex = 0;
        let isPlaying = false;

        const audioPlayer = document.getElementById('audioPlayer');

        window.addEventListener('DOMContentLoaded', () => {
            fetchSongsFromCloud();
        });

        // Ambil data lagu dari Cloud Online
        async function fetchSongsFromCloud() {
            try {
                const res = await fetch(JSONBIN_URL + "/latest", {
                    headers: { "X-Master-Key": "$2a$10$7Z8V..." }
                });
                const result = await res.json();
                if (result && result.record && Array.isArray(result.record.songs)) {
                    songsDatabase = result.record.songs;
                } else {
                    songsDatabase = [];
                }
            } catch (err) {
                songsDatabase = [];
            }
            renderSongList();
        }

        // Simpan data lagu ke Cloud Online agar sinkron ke HP
        async function saveSongsToCloud() {
            try {
                await fetch(JSONBIN_URL, {
                    method: 'PUT',
                    headers: { 
                        "Content-Type": "application/json",
                        "X-Master-Key": "$2a$10$7Z8V..."
                    },
                    body: JSON.stringify({ songs: songsDatabase })
                });
            } catch (err) {
                console.error("Gagal simpan ke cloud");
            }
        }

        window.switchTab = function(tab, event) {
            document.querySelectorAll('.sidebar .nav-link').forEach(el => el.classList.remove('active'));
            if (tab === 'home') {
                document.getElementById('tabHome').classList.remove('d-none');
                document.getElementById('tabUpload').classList.add('d-none');
                if (event) event.currentTarget.classList.add('active');
            } else if (tab === 'upload') {
                document.getElementById('tabHome').classList.add('d-none');
                document.getElementById('tabUpload').classList.remove('d-none');
                if (event) event.currentTarget.classList.add('active');
            }
        }

        function renderSongList() {
            const container = document.getElementById('songList');
            if (songsDatabase.length === 0) {
                container.innerHTML = `
                    <div class="col-12 text-center py-5">
                        <div class="text-muted mb-3" style="font-size: 3rem;"><i class="fa-solid fa-compact-disc"></i></div>
                        <h4 class="text-white">Belum ada lagu</h4>
                        <p class="text-muted small">Unggah file lagu melalui menu <strong>Unggah</strong>.</p>
                    </div>`;
                return;
            }

            let html = "";
            songsDatabase.forEach((song, index) => {
                html += `
                    <div class="col-6 col-md-3">
                        <div class="music-card p-2 p-md-3 h-100 d-flex flex-column justify-content-between" onclick="playSong(${index})">
                            <div>
                                <div class="album-art-wrapper mb-2 mb-md-3 shadow">
                                    <img src="${song.coverUrl}" class="album-art" alt="Cover">
                                </div>
                                <h6 class="text-white text-truncate mb-1 fw-semibold" style="font-size: 0.95rem;" title="${song.title}">${song.title}</h6>
                                <small class="text-muted text-truncate d-block" style="font-size: 0.75rem;">${song.artist}</small>
                            </div>
                            <div class="mt-2 d-flex justify-content-end">
                                <span class="badge bg-success bg-opacity-25 text-success rounded-pill px-2 py-1" style="font-size: 0.65rem;"><i class="fa-solid fa-play me-1"></i> Putar</span>
                            </div>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        // Fungsi Upload Cloudinary dengan Progress 0-100% dan Sync Online
        window.handleUploadMusic = function(e) {
            e.preventDefault();
            const btn = document.getElementById('btnUploadSubmit');
            btn.disabled = true;

            const audioFile = document.getElementById('upAudioFile').files[0];
            let fileName = audioFile.name;
            let title = fileName.substring(0, fileName.lastIndexOf('.')) || fileName;
            let artist = "PinuPlay Cloud";
            let coverUrl = "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=300";

            const formData = new FormData();
            formData.append('file', audioFile);
            formData.append('upload_preset', UPLOAD_PRESET);

            const xhr = new XMLHttpRequest();
            xhr.open('POST', `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/video/upload`, true);

            xhr.upload.onprogress = function(event) {
                if (event.lengthComputable) {
                    const percentComplete = Math.round((event.loaded / event.total) * 100);
                    btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin me-2"></i> Mengunggah... ${percentComplete}%`;
                }
            };

            xhr.onload = async function() {
                if (xhr.status === 200) {
                    try {
                        const data = JSON.parse(xhr.responseText);
                        const audioUrl = data.secure_url;

                        btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin me-2"></i> Menyimpan ke Database Cloud...`;

                        songsDatabase.unshift({
                            title: title,
                            artist: artist,
                            audioUrl: audioUrl,
                            coverUrl: coverUrl
                        });

                        await saveSongsToCloud();

                        alert("Berhasil! Lagu tersimpan dan otomatis sinkron ke HP.");
                        document.getElementById('uploadForm').reset();
                        
                        switchTab('home');
                        document.querySelectorAll('.sidebar .nav-link')[0].classList.add('active');
                        renderSongList();
                    } catch (err) {
                        console.error("Gagal menyimpan:", err);
                        alert("Gagal menyimpan data lagu.");
                    }
                } else {
                    alert("Gagal mengunggah file ke Cloudinary.");
                }
                btn.disabled = false;
                btn.innerHTML = "Unggah ke Cloud Sekarang";
            };

            xhr.onerror = function() {
                alert("Terjadi kesalahan jaringan saat mengunggah.");
                btn.disabled = false;
                btn.innerHTML = "Unggah ke Cloud Sekarang";
            };

            xhr.send(formData);
        }

        window.playSong = function(index) {
            currentSongIndex = index;
            const song = songsDatabase[index];

            document.getElementById('playerTitle').innerText = song.title;
            document.getElementById('playerArtist').innerText = song.artist;
            document.getElementById('playerCover').src = song.coverUrl;

            audioPlayer.src = song.audioUrl;
            audioPlayer.play();
            isPlaying = true;
            document.getElementById('playIcon').className = "fa-solid fa-pause";
        }

        window.togglePlay = function() {
            if (songsDatabase.length === 0) return;
            if (isPlaying) {
                audioPlayer.pause();
                isPlaying = false;
                document.getElementById('playIcon').className = "fa-solid fa-play";
            } else {
                if (!audioPlayer.src) playSong(0);
                else audioPlayer.play();
                isPlaying = true;
                document.getElementById('playIcon').className = "fa-solid fa-pause";
            }
        }

        window.nextSong = function() {
            if (songsDatabase.length === 0) return;
            currentSongIndex = (currentSongIndex + 1) % songsDatabase.length;
            playSong(currentSongIndex);
        }

        window.prevSong = function() {
            if (songsDatabase.length === 0) return;
            currentSongIndex = (currentSongIndex - 1 + songsDatabase.length) % songsDatabase.length;
            playSong(currentSongIndex);
        }

        window.updateProgress = function() {
            if (isNaN(audioPlayer.duration)) return;
            const progressPercent = (audioPlayer.currentTime / audioPlayer.duration) * 100;
            document.getElementById('progressFilled').style.width = progressPercent + '%';

            document.getElementById('currentTime').innerText = formatTime(audioPlayer.currentTime);
            document.getElementById('durationTime').innerText = formatTime(audioPlayer.duration);
        }

        window.seekAudio = function(e) {
            const width = document.getElementById('progressBar').clientWidth;
            const clickX = e.offsetX;
            const duration = audioPlayer.duration;
            audioPlayer.currentTime = (clickX / width) * duration;
        }

        window.changeVolume = function(val) {
            audioPlayer.volume = val;
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }
    </script>
</body>
</html>
