<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PinuPlay - Cloud Music Streaming</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome untuk ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #121212;
            --bg-panel: #181818;
            --bg-card: #282828;
            --accent: #1db954;
            --text-main: #ffffff;
            --text-muted: #b3b3b3;
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding-bottom: 100px;
        }
        /* Auth Container */
        #authScreen {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #000000, #1db95433);
        }
        .auth-card {
            background-color: var(--bg-panel);
            padding: 40px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        /* Main App Layout */
        .app-container { display: none; }
        .sidebar {
            background-color: #000;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            width: 260px;
            padding: 20px;
            border-right: 1px solid #282828;
        }
        .main-content {
            margin-left: 260px;
            padding: 30px;
        }
        .nav-link {
            color: var(--text-muted);
            font-weight: 600;
            padding: 10px 15px;
            border-radius: 4px;
            transition: 0.2s;
        }
        .nav-link:hover, .nav-link.active {
            color: var(--text-main);
            background-color: var(--bg-card);
        }
        .music-card {
            background-color: var(--bg-panel);
            border: none;
            border-radius: 8px;
            transition: 0.3s;
            cursor: pointer;
        }
        .music-card:hover {
            background-color: var(--bg-card);
            transform: translateY(-4px);
        }
        .album-art {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 6px;
        }
        /* Bottom Player Bar */
        .player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 90px;
            background-color: #181818;
            border-top: 1px solid #282828;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 1000;
        }
        .player-controls button {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 1.2rem;
            margin: 0 10px;
            cursor: pointer;
        }
        .player-controls button.btn-play {
            background-color: var(--text-main);
            color: #000;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }
        .progress-bar-custom {
            width: 100%;
            height: 5px;
            background-color: #404040;
            border-radius: 5px;
            cursor: pointer;
            position: relative;
        }
        .progress-filled {
            height: 100%;
            background-color: var(--accent);
            border-radius: 5px;
            width: 0%;
        }
    </style>
</head>
<body>

    <!-- SCREEN 1: LOGIN / REGISTER -->
    <div id="authScreen">
        <div class="auth-card text-center">
            <h2 class="text-white mb-4"><i class="fa-solid fa-music text-success"></i> PinuPlay</h2>
            <p class="text-muted mb-4">Masuk untuk mulai mendengarkan musik.</p>
            <form id="authForm" onsubmit="handleAuth(event)">
                <div class="mb-3 text-start">
                    <label class="form-label text-muted small">Username</label>
                    <input type="text" id="authUsername" class="form-control bg-dark text-white border-secondary" required>
                </div>
                <div class="mb-4 text-start">
                    <label class="form-label text-muted small">Password</label>
                    <input type="password" id="authPassword" class="form-control bg-dark text-white border-secondary" required>
                </div>
                <button type="submit" class="btn btn-success w-100 py-2 fw-bold">Masuk / Daftar</button>
            </form>
        </div>
    </div>

    <!-- SCREEN 2: MAIN DASHBOARD -->
    <div id="mainApp" class="app-container">
        <!-- Sidebar -->
        <div class="sidebar d-flex flex-column justify-content-between">
            <div>
                <h3 class="text-white mb-4"><i class="fa-solid fa-music text-success"></i> PinuPlay</h3>
                <ul class="nav flex-column gap-2">
                    <li class="nav-item"><a class="nav-link active" href="#" onclick="switchTab('home')"><i class="fa-solid fa-house me-2"></i> Beranda</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" onclick="switchTab('upload')"><i class="fa-solid fa-cloud-arrow-up me-2"></i> Unggah Musik</a></li>
                </ul>
            </div>
            <div class="border-top border-secondary pt-3">
                <span class="text-muted small d-block mb-2">Akun: <strong id="lblUser" class="text-white"></strong></span>
                <button class="btn btn-outline-danger btn-sm w-100" onclick="logout()"><i class="fa-solid fa-right-from-bracket me-1"></i> Keluar</button>
            </div>
        </div>

        <!-- Content Area -->
        <div class="main-content">
            <!-- TAB BERANDA -->
            <div id="tabHome">
                <h2 class="fw-bold mb-4">Koleksi Musik Anda</h2>
                <div id="songList" class="row g-4">
                    <!-- Data lagu dimuat dari localStorage -->
                </div>
            </div>

            <!-- TAB UPLOAD -->
            <div id="tabUpload" class="d-none">
                <h2 class="fw-bold mb-4">Unggah Musik ke Cloudinary</h2>
                <div class="card bg-panel border-secondary p-4" style="max-width: 600px; background-color: var(--bg-panel);">
                    <form id="uploadForm" onsubmit="handleUploadMusic(event)">
                        <div class="mb-3">
                            <label class="form-label text-muted">Judul Lagu</label>
                            <input type="text" id="upTitle" class="form-control bg-dark text-white border-secondary" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted">Nama Artis</label>
                            <input type="text" id="upArtist" class="form-control bg-dark text-white border-secondary" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted">File Audio MP3/WAV</label>
                            <input type="file" id="upAudioFile" class="form-control bg-dark text-white border-secondary" accept="audio/*" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label text-muted">Gambar Sampul Album (Cover)</label>
                            <input type="file" id="upCoverFile" class="form-control bg-dark text-white border-secondary" accept="image/*" required>
                        </div>
                        <button type="submit" id="btnUploadSubmit" class="btn btn-success w-100 fw-bold">Unggah ke Cloud</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- PLAYER BAR BAWAH -->
        <div class="player-bar">
            <div class="d-flex align-items-center" style="width: 30%;">
                <img id="playerCover" src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=100" class="rounded me-3" style="width: 55px; height: 55px; object-fit: cover;">
                <div>
                    <h6 id="playerTitle" class="m-0 text-white text-truncate" style="max-width: 200px;">Pilih Lagu</h6>
                    <small id="playerArtist" class="text-muted">PinuPlay Player</small>
                </div>
            </div>
            <div class="d-flex flex-column align-items-center" style="width: 40%;">
                <div class="player-controls mb-1">
                    <button onclick="prevSong()"><i class="fa-solid fa-backward-step"></i></button>
                    <button class="btn-play" onclick="togglePlay()"><i id="playIcon" class="fa-solid fa-play"></i></button>
                    <button onclick="nextSong()"><i class="fa-solid fa-forward-step"></i></button>
                </div>
                <div class="w-100 d-flex align-items-center gap-2">
                    <small id="currentTime" class="text-muted">0:00</small>
                    <div class="progress-bar-custom" id="progressBar" onclick="seekAudio(event)">
                        <div class="progress-filled" id="progressFilled"></div>
                    </div>
                    <small id="durationTime" class="text-muted">0:00</small>
                </div>
            </div>
            <div style="width: 30%;"></div>
        </div>
    </div>

    <!-- Audio Element -->
    <audio id="audioPlayer" ontimeupdate="updateProgress()" onended="nextSong()"></audio>

    <script>
        // Kredensial Cloudinary Anda
        const CLOUD_NAME = "gyqyo2kv";
        const UPLOAD_PRESET = "pinuplay_unsigned";

        let currentUser = localStorage.getItem('pinu_user');
        let songsDatabase = JSON.parse(localStorage.getItem('pinu_songs')) || [];
        let currentSongIndex = 0;
        let isPlaying = false;

        const audioPlayer = document.getElementById('audioPlayer');

        window.addEventListener('DOMContentLoaded', () => {
            if (currentUser) {
                showApp();
            }
        });

        function handleAuth(e) {
            e.preventDefault();
            const username = document.getElementById('authUsername').value.trim();
            currentUser = username;
            localStorage.setItem('pinu_user', username);
            showApp();
        }

        function logout() {
            localStorage.removeItem('pinu_user');
            location.reload();
        }

        function showApp() {
            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            document.getElementById('lblUser').innerText = currentUser;
            renderSongList();
        }

        function switchTab(tab) {
            document.querySelectorAll('.sidebar .nav-link').forEach(el => el.classList.remove('active'));
            if (tab === 'home') {
                document.getElementById('tabHome').classList.remove('d-none');
                document.getElementById('tabUpload').classList.add('d-none');
                event.target.classList.add('active');
            } else if (tab === 'upload') {
                document.getElementById('tabHome').classList.add('d-none');
                document.getElementById('tabUpload').classList.remove('d-none');
                event.target.classList.add('active');
            }
        }

        function renderSongList() {
            const container = document.getElementById('songList');
            if (songsDatabase.length === 0) {
                container.innerHTML = `<p class="text-muted">Belum ada lagu. Silakan unggah melalui menu Unggah Musik.</p>`;
                return;
            }

            let html = "";
            songsDatabase.forEach((song, index) => {
                html += `
                    <div class="col-md-3">
                        <div class="card music-card p-3 h-100" onclick="playSong(${index})">
                            <img src="${song.coverUrl}" class="album-art mb-3" alt="Cover">
                            <h5 class="text-white text-truncate mb-1">${song.title}</h5>
                            <small class="text-muted text-truncate">${song.artist}</small>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        async function uploadToCloudinary(file, resourceType = 'auto') {
            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', UPLOAD_PRESET);

            const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/${resourceType}/upload`, {
                method: 'POST',
                body: formData
            });
            const data = await res.json();
            if (data.secure_url) {
                return data.secure_url;
            } else {
                throw new Error("Gagal mengunggah ke Cloudinary. Periksa kembali preset unsigned Anda.");
            }
        }

        async function handleUploadMusic(e) {
            e.preventDefault();
            const btn = document.getElementById('btnUploadSubmit');
            btn.disabled = true;
            btn.innerText = "Mengunggah ke Cloud...";

            try {
                const title = document.getElementById('upTitle').value;
                const artist = document.getElementById('upArtist').value;
                const audioFile = document.getElementById('upAudioFile').files[0];
                const coverFile = document.getElementById('upCoverFile').files[0];

                const audioUrl = await uploadToCloudinary(audioFile, 'video');
                const coverUrl = await uploadToCloudinary(coverFile, 'image');

                songsDatabase.push({
                    title: title,
                    artist: artist,
                    audioUrl: audioUrl,
                    coverUrl: coverUrl,
                    uploader: currentUser
                });

                localStorage.setItem('pinu_songs', JSON.stringify(songsDatabase));

                alert("Musik berhasil diunggah ke Cloudinary!");
                document.getElementById('uploadForm').reset();
                switchTab('home');
                document.querySelector('.sidebar .nav-link').classList.add('active');
                renderSongList();
            } catch (err) {
                alert(err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "Unggah ke Cloud";
            }
        }

        function playSong(index) {
            currentSongIndex = index;
            const song = songsDatabase[index];

            document.getElementById('playerTitle').innerText = song.title;
            document.getElementById('playerArtist').innerText = song.artist;
            document.getElementById('playerCover').src = song.coverUrl;

            audioPlayer.src = song.audioUrl;
            audioPlayer.play();
            isPlaying = true;
            document.getElementById('playIcon').className = "fa-solid fa-pause";
        }

        function togglePlay() {
            if (songsDatabase.length === 0) return;
            if (isPlaying) {
                audioPlayer.pause();
                isPlaying = false;
                document.getElementById('playIcon').className = "fa-solid fa-play";
            } else {
                if (!audioPlayer.src) playSong(0);
                else audioPlayer.play();
                isPlaying = true;
                document.getElementById('playIcon').className = "fa-solid fa-pause";
            }
        }

        function nextSong() {
            if (songsDatabase.length === 0) return;
            currentSongIndex = (currentSongIndex + 1) % songsDatabase.length;
            playSong(currentSongIndex);
        }

        function prevSong() {
            if (songsDatabase.length === 0) return;
            currentSongIndex = (currentSongIndex - 1 + songsDatabase.length) % songsDatabase.length;
            playSong(currentSongIndex);
        }

        function updateProgress() {
            if (isNaN(audioPlayer.duration)) return;
            const progressPercent = (audioPlayer.currentTime / audioPlayer.duration) * 100;
            document.getElementById('progressFilled').style.width = progressPercent + '%';

            document.getElementById('currentTime').innerText = formatTime(audioPlayer.currentTime);
            document.getElementById('durationTime').innerText = formatTime(audioPlayer.duration);
        }

        function seekAudio(e) {
            const width = document.getElementById('progressBar').clientWidth;
            const clickX = e.offsetX;
            const duration = audioPlayer.duration;
            audioPlayer.currentTime = (clickX / width) * duration;
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }
    </script>
</body>
</html>
